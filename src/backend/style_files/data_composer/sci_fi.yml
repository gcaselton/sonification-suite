name: "Sci-Fi"

description: "Spacey strings get brighter as the values in Column 2 increase. Uses Column 1 as the time axis."

generator:
  type: "sampler"
  sample: "Sci-Fi Strings"
  mods:
    looping: "forwardback"
    loop_start: 0
    loop_end: 5.

sources: 'objects'

map:
 - output: "time"

 - output: "cutoff"
   output_range: [0.3, 1]

notes: ['A3']







