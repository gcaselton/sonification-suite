name: Mallets

description: >
  Mallets play the stars from left to right, with bluer/hotter stars playing a higher pitch,
  and redder/cooler stars playing lower pitches. Brighter stars are louder. Uses a C blues scale.

generator:
  type: 'sampler'
  sample: 'Mallets'

map:
    
  - input: 'magnitude'
    output: 'volume'
    output_range: [0.05, 1]
    function: 'invert'

  - input: 'ra_corrected'
    input_range: ['0%', '110%']
    output: 'time'
    function: 'invert'

  - input: 'colour'
    output: 'pitch'
    output_range: [0.1, 1]
    function: 'invert'

sources: 'events'

notes: ['C3','D#3','F3','F#3','G3','A#3','C4']