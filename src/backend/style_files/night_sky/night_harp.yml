name: 'Night Harp'

description: 'A harp plays the night sky from brightest to dimmest stars, where higher notes signify bluer/hotter stars.'

generator:
  type: 'sampler'
  sample: 'Harp'

map:
  
  - input: 'colour'
    output: 'pitch'
    function: 'invert'

  - input: 'magnitude'
    output: 'volume'
    output_range: [0.1, 1]
    function: 'invert'

  - input: 'magnitude'
    input_range: ['0%', '120%']
    output: 'time'

  - input: 'relative_azimuth'
    input_range: [0, 360]
    output: 'azimuth'

  - input: 'zenith_angle'
    input_range: [0, 180]
    output: 'polar'

angle_unit: 'degrees'

sources: 'events'

notes: ['F2', 'C2', 'F3', 'A3', 'E4', 'G4']