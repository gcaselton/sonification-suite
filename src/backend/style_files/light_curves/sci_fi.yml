name: "Sci-Fi"

description: "Spacey strings get brighter as the star gets brighter."

generator:
  type: 'sampler'
  preset: 'sustain'
  sample: 'sound_assets:Space Strings'
  mods:
    looping: 'forwardback'
    loop_start: 0.2
    loop_end: 5.
    filter: 'on'

sources: 'objects'

map:
  - input: 'flux'
    output: 'cutoff'
    output_range: [0.3, 1]
  
  - input: 'time'
    output: 'time_evo'







